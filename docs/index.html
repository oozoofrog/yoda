<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>yoda learning reader</title>
    <meta
      name="description"
      content="Swift 컴파일러 학습 문서를 개인용 2단 리더 형태로 탐색하는 정적 웹 문서"
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="title-block">
          <div class="eyebrow">yoda personal learning reader</div>
          <h1>학습 문서 뷰어</h1>
          <p>좌측에서 순서대로 문서를 고르고, 우측에서 내용을 읽고 메모합니다.</p>
        </div>
        <div class="toolbar">
          <label class="search-box">
            <span>목차 검색</span>
            <input id="searchInput" type="search" placeholder="문서 제목, 키워드 검색" />
          </label>
          <button id="themeToggle" class="ghost-button" type="button">다크/라이트</button>
        </div>
      </header>

      <div class="reader-layout">
        <aside class="toc-pane">
          <div class="pane-card sticky-pane">
            <div class="pane-header">
              <h2>전체 목차</h2>
              <span id="tocCount" class="count-pill"></span>
            </div>
            <div id="docList" class="doc-list"></div>
          </div>
        </aside>

        <main class="content-pane">
          <article class="pane-card reader-card">
            <header id="docHeader" class="doc-header"></header>
            <section id="docOutline" class="doc-outline"></section>
            <div id="docContent" class="doc-content"></div>
          </article>

          <section class="pane-card notes-card">
            <h2>개인 메모</h2>
            <p class="muted">현재 문서에 대한 요약, 다음에 볼 파일, 막힌 점을 자유롭게 남깁니다.</p>
            <textarea id="docNotesArea" class="notes-textarea" placeholder="여기에 개인 메모를 적습니다."></textarea>
          </section>
        </main>
      </div>
    </div>

    <button id="floatingOutlineToggle" class="floating-outline-toggle" type="button" aria-expanded="false" aria-controls="floatingOutlinePanel">
      현재 위치
    </button>
    <aside id="floatingOutlinePanel" class="floating-outline-panel" aria-label="현재 문서 목차">
      <div class="floating-outline-card">
        <div class="floating-outline-header">
          <div>
            <div class="floating-outline-kicker">현재 문서 목차</div>
            <strong id="floatingCurrentSection">문서 상단</strong>
          </div>
          <button id="floatingOutlineClose" class="ghost-button compact-button" type="button" aria-label="목차 닫기">닫기</button>
        </div>
        <div id="floatingOutlineList" class="floating-outline-list"></div>
      </div>
    </aside>

    <script src="app.js" type="module"></script>
  </body>
</html>
