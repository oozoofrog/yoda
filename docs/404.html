<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>yoda learning reader</title>
    <meta
      name="description"
      content="Swift 컴파일러 학습 문서를 개인용 리더 형태로 탐색하는 정적 웹 문서"
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="floatingNavColumn" class="floating-nav-column" aria-label="문서 탐색 목차">
      <section class="floating-card floating-global-card">
        <div class="floating-card-header">
          <div>
            <div class="floating-kicker">전체 문서</div>
            <h2>전체 목차</h2>
          </div>
          <span id="tocCount" class="count-pill"></span>
        </div>
        <div id="docList" class="doc-list"></div>
      </section>

      <section class="floating-card floating-current-card">
        <div class="floating-card-header">
          <div>
            <div class="floating-kicker">현재 문서</div>
            <h2 id="floatingCurrentSection">문서 상단</h2>
          </div>
        </div>
        <div id="floatingOutlineList" class="floating-outline-list"></div>
      </section>
    </div>

    <button id="navToggle" class="floating-nav-toggle" type="button" aria-expanded="false" aria-controls="floatingNavColumn">
      목차 보기
    </button>

    <div class="app-shell">
      <header class="topbar">
        <div class="title-block">
          <div class="eyebrow">yoda personal learning reader</div>
          <h1>학습 문서 뷰어</h1>
          <p>왼쪽에는 전체 목차와 현재 문서 목차가 떠 있고, 오른쪽에서 현재 문서를 읽고 메모합니다.</p>
        </div>
        <div class="toolbar">
          <label class="search-box">
            <span>목차 검색</span>
            <input id="searchInput" type="search" placeholder="문서 제목, 키워드 검색" />
          </label>
          <button id="themeToggle" class="ghost-button" type="button">다크/라이트</button>
        </div>
      </header>

      <main class="content-pane">
        <article class="pane-card reader-card">
          <header id="docHeader" class="doc-header"></header>
          <div id="docContent" class="doc-content"></div>
        </article>

        <section class="pane-card notes-card">
          <h2>개인 메모</h2>
          <p class="muted">현재 문서에 대한 요약, 다음에 볼 파일, 막힌 점을 자유롭게 남깁니다.</p>
          <textarea id="docNotesArea" class="notes-textarea" placeholder="여기에 개인 메모를 적습니다."></textarea>
        </section>
      </main>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
