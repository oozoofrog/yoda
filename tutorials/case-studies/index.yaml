    pr_context_summary: "커밋 메시지는 단순하지만, 실제로는 이미 존재하던 simplification을 SILCombine 쪽에도 활성화하는 wiring 변화입니다. 이런 종류의 변경은 코드 양은 적어도 효과 범위가 넓습니다."
